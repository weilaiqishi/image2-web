name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan complete Git history
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"

      - name: Scan complete history
        shell: bash
        env:
          GITLEAKS_CONFIG_TOML: |
            title = "Image2 Studio secret scan"

            [extend]
            useDefault = true
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --no-banner \
            --no-color \
            --redact=100 \
            --ignore-gitleaks-allow \
            --gitleaks-ignore-path="$RUNNER_TEMP" \
            --max-archive-depth=1 \
            --log-opts="--all" \
            .
