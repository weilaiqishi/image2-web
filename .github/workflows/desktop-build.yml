name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: image2-studio-macos-arm64
            paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: image2-studio-macos-x64
            paths: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows 10 x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: image2-studio-windows10-x64
            paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify bundle icons
        shell: bash
        run: |
          test -f src-tauri/icons/icon.icns
          test -f src-tauri/icons/icon.ico

      - name: Build desktop packages
        run: npm run tauri:build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: image2-studio-*
          path: downloaded-installers

      - name: Collect and verify release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir release-assets

          while IFS= read -r -d '' installer; do
            filename="$(basename "$installer")"
            destination="release-assets/$filename"

            if [[ -e "$destination" ]]; then
              echo "Duplicate installer filename: $filename" >&2
              exit 1
            fi

            cp "$installer" "$destination"
          done < <(find downloaded-installers -type f \( \
            -name '*.dmg' -o \
            -name '*.exe' -o \
            -name '*.msi' \
          \) -print0)

          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.msi' | wc -l)" -eq 1

          (
            cd release-assets
            find . -maxdepth 1 -type f \( \
              -name '*.dmg' -o \
              -name '*.exe' -o \
              -name '*.msi' \
            \) -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #'
          ) > release-assets/SHA256SUMS

      - name: Create GitHub draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Image2 Studio $TAG_NAME" \
              --draft \
              --prerelease
            gh release upload "$TAG_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Image2 Studio $TAG_NAME" \
              --generate-notes \
              --draft \
              --prerelease
          fi
